{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
    <h1 class="h3 mb-4">書籍一覧</h1>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
        {% for book in books %}
        <div class="col">
            <div class="card h-100 shadow-sm">
                {% if book.thumbnail_url %}
                <img src="{{ book.thumbnail_url }}" class="card-img-top object-fit-cover" alt="{{ book.title }}" style="height: 200px;">
                {% else %}
                <div class="card-img-top bg-secondary-subtle d-flex align-items-center justify-content-center" style="height: 200px;">
                    <span class="text-muted">No Image</span>
                </div>
                {% endif %}
                <div class="card-body d-flex flex-column">
                    {% if book.category %}
                    <span class="badge bg-secondary mb-2 w-auto align-self-start">{{ book.category.name }}</span>
                    {% endif %}
                    <h5 class="card-title text-truncate" title="{{ book.title }}">{{ book.title }}</h5>
                    <p class="card-text text-muted small mb-3">{{ book.author }}</p>
                    <div class="mt-auto">
                        <a href="{{ book.get_absolute_url }}" class="btn btn-outline-primary btn-sm w-100">詳細を見る</a>
                    </div>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12">
            <p class="text-muted">登録されている書籍はありません。</p>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
