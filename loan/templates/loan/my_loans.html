<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Page</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="bg-light" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

<div class="container py-5" style="max-width: 800px;">
  <h1 class="mb-4 fw-bold">My Page</h1>

  <!-- 動的メッセージ表示領域 -->
  <div id="message-container">
    {% include 'loan/partials/messages.html' %}
  </div>

  <!-- 1. 現在借りている本 -->
  <section class="mb-5">
    <h2 class="h4 border-bottom pb-2 mb-3 text-secondary">現在借りている本</h2>

    {% if loans %}
      <div class="row g-3" id="loan-list">
        {% for loan in loans %}
          <!-- 対象の本カード -->
          <div class="col-12" id="loan-card-{{ loan.id }}">
            <div class="card shadow-sm">
              <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                  <h5 class="card-title mb-1 fw-bold">{{ loan.book_item.book.title }}</h5>
                  <p class="card-text text-muted small mb-0">
                    返却期限: <span class="badge bg-info text-dark">{{ loan.due_date|date:"Y/m/d" }}</span>
                  </p>
                </div>
                
                <!-- 返却フォーム（HTMX） -->
                <form hx-post="{% url 'loan:return' %}"
                      hx-target="#loan-card-{{ loan.id }}"
                      hx-swap="outerHTML">
                  <input type="hidden" name="loan_id" value="{{ loan.id }}">
                  <button type="submit" class="btn btn-outline-danger btn-sm">
                    返却する
                  </button>
                </form>

              </div>
            </div>
          </div>
        {% endfor %}
      </div>
    {% else %}
      <p class="text-muted">現在借りている本はありません。</p>
    {% endif %}
  </section>

  <!-- 2. 予約中の本 -->
  <section>
    <h2 class="h4 border-bottom pb-2 mb-3 text-secondary">予約中の本</h2>
    <div class="card bg-white text-muted p-3 text-center border-dashed">
      <small>※ 予約機能は準備中です</small>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
